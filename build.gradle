plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"noclip_backrooms" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "noclip_backrooms_test"
		enableGameTests = false
		// Singleplayer only, so the server EULA is never needed.
		enableClientGameTests = true
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

// Run only some of the real-client tests: gradlew runClientGameTest -Plevels=1,3 picks test classes by their package
// (a number n means level<n>, with "." written as "p": 0.1 -> level0p1; other names as they are, e.g. look).
// -Psections=people,secrets runs only those sections of the Level 1 test. Leaving them out runs everything.
def testLevels = providers.gradleProperty("levels").getOrElse("")
def testSections = providers.gradleProperty("sections").getOrElse("")

tasks.named("processGametestResources") {
	inputs.property "levels", testLevels
	def metadata = new File(destinationDir, "fabric.mod.json")
	doLast {
		if (testLevels.isBlank()) return
		def wanted = testLevels.split(",").collect { it.trim() }.collect { it ==~ /[0-9].*/ ? "level" + it.replace(".", "p") : it } as Set
		def json = new groovy.json.JsonSlurper().parse(metadata)
		def all = json.entrypoints["fabric-client-gametest"]
		def kept = all.findAll { wanted.contains(it.tokenize(".")[-2]) }
		if (kept.isEmpty()) throw new GradleException("no client tests for -Plevels=" + testLevels + "; there are " + all.collect { it.tokenize(".")[-2] })
		json.entrypoints["fabric-client-gametest"] = kept
		metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
	}
}

tasks.named("runClientGameTest") {
	if (!testSections.isBlank()) environment "NOCLIP_ONLY", testSections
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
